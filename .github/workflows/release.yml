# v* 태그를 push 하면 Windows 에서 빌드해 포터블 zip 과 설치 프로그램을 GitHub Release 에 올린다.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 의존성 받기
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/setup-deps.ps1 -NoModel

      - name: Inno Setup 설치
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: 빌드 + 패키징
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/package.ps1

      - name: 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: youshadow-win64
          path: |
            dist/*.zip
            dist/*.exe

      - name: Release 생성
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = Get-ChildItem dist/*.zip, dist/*.exe | ForEach-Object { $_.FullName }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber
          } else {
            gh release create $tag $files --title "YouShadow $tag" --generate-notes
          }
